appId: com.chatbot-demo.app
productName: Chatbot Demo
directories:
  output: release
files:
  - electron/**/*
  - '!node_modules/**/*'          # 运行时依赖都在 resources/dist（extraResources），asar 里不需要 node_modules
extraResources:
  - from: dist
    to: dist
compression: maximum
electronLanguages:
  - en-US
  - zh-CN
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Chatbot Demo